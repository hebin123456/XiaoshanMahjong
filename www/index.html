<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>萧山麻将 · 单机版</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<meta name="theme-color" content="#0b3d2e" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="assets/icon.svg" />
<link rel="icon" href="assets/icon.svg" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app" id="app">

  <!-- 牌桌区域：对家 / 上家 / 下家 / 中央 -->
  <section class="table" id="table">
    <div class="seat seat--top" data-seat="2">
      <header class="seat__head"><span class="seat__name"></span><span class="seat__badge"></span></header>
      <div class="seat__melds"></div>
      <div class="seat__river"></div>
      <div class="seat__back"></div>
    </div>

    <div class="seat seat--left" data-seat="3">
      <header class="seat__head"><span class="seat__name"></span><span class="seat__badge"></span></header>
      <div class="seat__melds"></div>
      <div class="seat__river"></div>
      <div class="seat__back"></div>
    </div>

    <div class="seat seat--right" data-seat="1">
      <header class="seat__head"><span class="seat__name"></span><span class="seat__badge"></span></header>
      <div class="seat__melds"></div>
      <div class="seat__river"></div>
      <div class="seat__back"></div>
    </div>

    <div class="center">
      <div class="center__indicator" id="indicator"></div>
      <div class="center__status" id="status"></div>
      <div class="center__meta" id="meta"></div>
    </div>
  </section>

  <!-- 你的区域：亮牌 + 手牌 + 操作 -->
  <section class="bottom" id="bottom">
    <div class="me">
      <header class="me__head">
        <span class="seat__name" id="my-name">你</span>
        <span class="seat__badge" id="my-badge"></span>
        <span class="me__tip" id="tip"></span>
        <button class="btn btn--ghost" id="btn-help" type="button">规则</button>
        <button class="btn btn--ghost" id="btn-new" type="button">新一局</button>
      </header>
      <div class="me__melds" id="my-melds"></div>
      <div class="me__hand" id="my-hand"></div>
      <div class="me__river" id="my-river"></div>
    </div>
    <div class="controls" id="controls"></div>
  </section>
</div>

<!-- 结算浮层 -->
<div class="overlay" id="overlay" hidden>
  <div class="panel" id="overlay-panel"></div>
</div>

<!-- 开局设置 -->
<div class="overlay" id="setup" hidden>
  <div class="panel">
    <h2 class="panel__title">萧山麻将 · 开局</h2>
    <p class="panel__sub">你 vs 3 个电脑 AI</p>
    <fieldset class="opt">
      <legend>胡牌规则</legend>
      <label><input type="radio" name="rush" value="no" checked /> 自摸专属（不能捉冲点炮，边锋规则）</label>
      <label><input type="radio" name="rush" value="yes" /> 允许捉冲（别人打出的牌也能胡）</label>
    </fieldset>
    <fieldset class="opt">
      <legend>电脑速度</legend>
      <label><input type="radio" name="speed" value="fast" checked /> 快</label>
      <label><input type="radio" name="speed" value="normal" /> 正常</label>
    </fieldset>
    <div class="panel__actions">
      <button class="btn btn--primary" id="btn-start" type="button">开始对局</button>
    </div>
  </div>
</div>

<!-- 规则说明 -->
<div class="overlay" id="help" hidden>
  <div class="panel panel--wide">
    <h2 class="panel__title">萧山麻将规则（本项目实现）</h2>
    <ul class="rules">
      <li>136 张牌，每家码 17 墩；财神为翻出的那张牌，<b>白板（z7）为万能百搭</b>。</li>
      <li>抢庄制：谁胡谁做庄，流局则连庄。</li>
      <li>吃只吃上家；碰 / 杠任意家；杠后补牌自摸即「杠开」。</li>
      <li>打出的财神（白板）其他三家不能吃碰。</li>
      <li>已吃上家 2 摊后，不允许「吃张打张」。</li>
      <li>结算：自摸三家各付；捉冲由点炮者独付；吃碰杠达 3 摊触发承包者独付并加倍。</li>
    </ul>
    <div class="panel__actions">
      <button class="btn btn--primary" id="btn-close-help" type="button">知道了</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
