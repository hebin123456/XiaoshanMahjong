name: Android (Cocos2d-x native)

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK + NDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"
          SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | sort | tail -n1)"
          test -n "$SDKMGR" || { echo "未找到 sdkmanager"; exit 1; }
          echo "Using sdkmanager: $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools" "ndk;21.4.7075529"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          # CI 直接用 setup-gradle 提供的 gradle，不依赖仓库内的 wrapper；
          # 故关闭 wrapper jar 校验，避免旧 wrapper 触发校验失败
          validate-wrappers: false

      - name: Build debug APK
        run: gradle -p native/proj.android assembleDebug --stacktrace

      - name: Rename APK
        run: cp native/proj.android/app/build/outputs/apk/debug/app-debug.apk xiaoshan-mahjong.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoshan-mahjong-apk
          path: xiaoshan-mahjong.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: 开发版（最新构建）
          body: |
            自动构建的萧山麻将安卓包（基于 cocostudio-mahjong 改造）。

            - commit：${{ github.sha }}
            - 运行号：${{ github.run_number }}
          files: xiaoshan-mahjong.apk
          make_latest: true
