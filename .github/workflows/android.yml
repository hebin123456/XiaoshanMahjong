name: Android

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "--- 预装 platforms ---"; ls "$SDK_ROOT/platforms" 2>/dev/null || true
          echo "--- 预装 build-tools ---"; ls "$SDK_ROOT/build-tools" 2>/dev/null || true
          if [ -d "$SDK_ROOT/platforms/android-35" ] && [ -d "$SDK_ROOT/build-tools/35.0.0" ]; then
            echo "已预装 android-35 与 build-tools 35.0.0，跳过安装"
          else
            SDKMGR="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | sort | tail -n1)"
            echo "Using sdkmanager: $SDKMGR"
            test -n "$SDKMGR" || { echo "未找到 sdkmanager"; exit 1; }
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Unit tests
        run: gradle test --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk xiaoshan-mahjong.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoshan-mahjong-apk
          path: xiaoshan-mahjong.apk
          if-no-files-found: error

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: 开发版（最新构建）
          body: |
            自动构建的萧山麻将安卓包。

            - commit：${{ github.sha }}
            - 运行号：${{ github.run_number }}
          files: xiaoshan-mahjong.apk
          make_latest: true
